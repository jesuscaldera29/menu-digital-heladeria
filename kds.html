<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS - Cocina en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar for dark mode */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }
    
    body { background-color: #0f1115; color: #f3f4f6; }
    
    .card-pendiente { border-top: 6px solid #f97316; } /* Orange */
    .card-preparacion { border-top: 6px solid #3b82f6; } /* Blue */
    .card-retrasada { border-top: 6px solid #ef4444; animation: pulse 2s infinite; } /* Red Pulse */
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-[#1f232b] border-b border-[#2d333f] px-6 py-4 flex justify-between items-center shrink-0 shadow-lg">
    <div class="flex items-center gap-4">
      <span class="text-4xl bg-gradient-to-r from-orange-500 to-red-500 text-transparent bg-clip-text font-black">🔪 KDS</span>
      <div class="h-8 w-px bg-gray-600 mx-2"></div>
      <div>
        <h1 id="businessName" class="text-xl font-black text-white tracking-wide">Cargando...</h1>
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"><span id="orderCount">0</span> Pedidos Activos</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-[#15181e] px-4 py-2 rounded-xl border border-[#2d333f]">
        <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
        <span class="text-xs font-bold text-gray-300">En Vivo</span>
      </div>
      <button onclick="toggleSound()" id="btnSound" class="bg-[#2d333f] hover:bg-[#3d4554] text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl transition-all shadow-md">
        🔊
      </button>
      <button onclick="logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-500 border border-red-500/50 px-4 py-2 rounded-xl font-bold text-sm transition-all shadow-md">
        Salir
      </button>
    </div>
  </header>

  <!-- Main KDS Grid -->
  <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scroll">
    <div id="kdsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 items-start auto-rows-max">
      <!-- Tarjetas de órdenes se cargarán aquí -->
      <div class="w-full h-full flex flex-col items-center justify-center text-gray-500 space-y-4">
        <div class="animate-spin w-12 h-12 border-4 border-gray-600 border-t-orange-500 rounded-full"></div>
        <p class="font-bold text-lg tracking-widest uppercase">Sincronizando con Cocina...</p>
      </div>
    </div>
  </main>

  <!-- Audio Element -->
  <audio id="kdsAlertSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <!-- Toast Notificaciones -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-[#2d333f] text-white border border-[#4d576b] font-bold py-3 px-6 rounded-xl shadow-2xl z-[999] opacity-0 pointer-events-none transition-all duration-300 transform translate-y-5"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/kds.js"></script>

</body>
</html>
