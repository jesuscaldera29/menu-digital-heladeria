<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Reparto - MenuPro</title>
  
  <!-- Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      color: white;
      padding: 12px 24px;
      border-radius: 16px;
      z-index: 9999;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error {
      background: #ef4444;
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800">

  <!-- TOP DECORATION -->
  <div class="h-2 bg-gradient-to-r from-orange-500 to-red-600 w-full sticky top-0 z-[110]"></div>

  <div class="max-w-md mx-auto min-h-screen flex flex-col pb-12">
    <!-- HEADER -->
    <header class="bg-white p-5 border-b border-slate-100 flex flex-col gap-3 sticky top-2 z-10 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-orange-500 flex items-center justify-center text-white text-xl shadow-md">
            🛵
          </div>
          <div>
            <h1 class="text-lg font-black tracking-tight leading-none" id="driverName">Repartidor</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1" id="businessName">Cargando local...</p>
          </div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2 rounded-xl hover:bg-slate-50 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>

      <!-- DISPONIBILIDAD Y RESUMEN -->
      <div class="flex items-center justify-between bg-slate-50 p-3 rounded-2xl border border-slate-100 mt-1">
        <div class="flex items-center gap-2">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" id="statusPulse"></span>
            <span class="relative inline-flex rounded-full h-3 w-3" id="statusDot"></span>
          </span>
          <span class="text-xs font-bold text-slate-600" id="statusLabel">Cargando estado...</span>
        </div>
        <button onclick="toggleAvailability()" id="btnToggleAvailability" class="bg-white text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm hover:bg-slate-50 active:scale-95 transition-all">
          Cambiar
        </button>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 p-4 space-y-6">
      
      <!-- ENTREGAS PENDIENTES -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-black text-base flex items-center gap-2">
            📦 Despachos Activos <span class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-black" id="activeCount">0</span>
          </h2>
          <button onclick="loadDeliveries()" class="text-orange-600 text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
            🔄 Actualizar
          </button>
        </div>

        <div id="pendingDeliveries" class="space-y-4">
          <!-- Spinner de carga -->
          <div class="py-12 text-center text-slate-400">
            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-orange-500 mx-auto mb-3"></div>
            <p class="text-xs font-bold">Buscando despachos asignados...</p>
          </div>
        </div>
      </div>

      <!-- RESUMEN DEL DÍA -->
      <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-4">
        <h3 class="font-black text-sm text-slate-400 uppercase tracking-widest flex items-center gap-2">🏆 Logros de hoy</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Completados</p>
            <p class="text-2xl font-black text-slate-800 mt-1" id="completedCount">0</p>
          </div>
          <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Propinas Recibidas</p>
            <p class="text-2xl font-black text-green-600 mt-1" id="totalTips">$0</p>
          </div>
        </div>
      </div>

      <!-- HISTORIAL RECIENTE -->
      <div>
        <h2 class="font-black text-base text-slate-800 mb-3 flex items-center gap-2">📜 Entregados Recientes</h2>
        <div id="completedDeliveries" class="space-y-3">
          <p class="text-xs text-slate-400 italic text-center py-6">No has entregado pedidos hoy todavía.</p>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Supabase scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3"></script>
  <script src="js/driver.js?v=1"></script>
  <!-- Botón Retroceso a Admin (Solo Admin/Superadmin) -->
  <button id="globalAdminBackBtn" onclick="window.location.href='admin.html'" class="hidden fixed bottom-6 left-6 bg-white hover:bg-orange-500 border border-gray-200 hover:border-orange-500 text-black hover:text-white font-bold w-14 h-14 rounded-full shadow-2xl z-[9999] flex items-center justify-center transition-all duration-300 active:scale-95 group" title="Volver al Panel de Administración">
    <span class="text-2xl group-hover:-translate-x-1 transition-transform">⬅️</span>
  </button>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const role = localStorage.getItem('staff_role');
      if (!role || role === 'Administrador' || role === 'Superadmin') {
        const btn = document.getElementById('globalAdminBackBtn');
        if(btn) btn.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
